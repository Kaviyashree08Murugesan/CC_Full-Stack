<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Example</title>
</head>

<body>

    <h1>JavaScript Example</h1>

    <!-- Internal JavaScript -->
    <p id="message">Click the button</p>

    <button onclick="changeMessage()">Internal JS</button>

    <!-- External JavaScript -->
    <button onclick="showName()">External JS</button>

    <script>
        // Internal JavaScript function
        function changeMessage() {
            document.getElementById("message").innerHTML =
                "Hello! Internal JavaScript is working.";
        }
    </script>

    <!-- Linking external JavaScript file -->
    <script src="ExternalJS.js"></script>

</body>
</html>
