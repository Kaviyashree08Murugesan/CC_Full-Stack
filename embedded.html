<!DOCTYPE html>
<html>
<head>
    <title>Embedded CSS Example</title>

    <style>
        body {
            background-color: lightblue;
        }

        h1 {
            color: red;
            text-align: center;
        }

        p {
            color: green;
            font-size: 20px;
        }
    </style>

</head>

<body>

    <h1>Welcome to CSS</h1>

    <p>This is an Embedded (Internal) CSS example.</p>

</body>
</html>
